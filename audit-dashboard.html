<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lennox Fields - Site Audit Dashboard</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242736;
    --border: #2e3245;
    --text: #e4e6ef;
    --text-muted: #8b8fa3;
    --red: #ff6b6b;
    --red-bg: rgba(255,107,107,0.1);
    --orange: #ffa94d;
    --orange-bg: rgba(255,169,77,0.1);
    --yellow: #ffd43b;
    --yellow-bg: rgba(255,212,59,0.1);
    --blue: #74c0fc;
    --blue-bg: rgba(116,192,252,0.1);
    --green: #69db7c;
    --green-bg: rgba(105,219,124,0.1);
    --purple: #b197fc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 20px 32px; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 22px; font-weight: 700; }
  .header p { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  .stats-bar { display: flex; gap: 12px; padding: 20px 32px; flex-wrap: wrap; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 140px; cursor: pointer; transition: all 0.15s; }
  .stat-card:hover { border-color: var(--purple); transform: translateY(-1px); }
  .stat-card.active { border-color: var(--purple); background: var(--surface2); }
  .stat-card .num { font-size: 28px; font-weight: 800; }
  .stat-card .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .stat-card.p0 .num { color: var(--red); }
  .stat-card.p1 .num { color: var(--orange); }
  .stat-card.p2 .num { color: var(--yellow); }
  .stat-card.p3 .num { color: var(--blue); }
  .stat-card.all .num { color: var(--purple); }
  .stat-card.fixed .num { color: var(--green); }

  .controls { padding: 0 32px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .search { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px; width: 300px; outline: none; }
  .search:focus { border-color: var(--purple); }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; color: var(--text-muted); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { background: var(--surface2); color: var(--text); border-color: var(--purple); }
  .progress-bar { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
  .progress-track { width: 120px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s; }

  .main { padding: 0 32px 40px; }
  .issue-list { display: flex; flex-direction: column; gap: 8px; }

  .issue { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: all 0.15s; }
  .issue:hover { border-color: #3e4260; }
  .issue.resolved { opacity: 0.5; }
  .issue-header { padding: 16px 20px; cursor: pointer; display: flex; align-items: flex-start; gap: 14px; }
  .issue-checkbox { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 5px; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all 0.15s; }
  .issue-checkbox:hover { border-color: var(--green); }
  .issue-checkbox.checked { background: var(--green); border-color: var(--green); }
  .issue-checkbox.checked::after { content: '✓'; color: var(--bg); font-size: 13px; font-weight: 700; }
  .issue-body { flex: 1; }
  .issue-title { font-size: 15px; font-weight: 600; }
  .issue-meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .tag.p0 { background: var(--red-bg); color: var(--red); }
  .tag.p1 { background: var(--orange-bg); color: var(--orange); }
  .tag.p2 { background: var(--yellow-bg); color: var(--yellow); }
  .tag.p3 { background: var(--blue-bg); color: var(--blue); }
  .tag.category { background: rgba(177,151,252,0.1); color: var(--purple); }
  .chevron { color: var(--text-muted); flex-shrink: 0; margin-top: 2px; transition: transform 0.2s; font-size: 18px; }
  .issue.open .chevron { transform: rotate(90deg); }

  .issue-details { display: none; padding: 0 20px 20px 54px; }
  .issue.open .issue-details { display: block; }
  .detail-section { margin-bottom: 14px; }
  .detail-section h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
  .detail-section p, .detail-section li { font-size: 14px; color: var(--text); line-height: 1.7; }
  .detail-section ul { padding-left: 18px; }
  .detail-section code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-size: 13px; color: var(--yellow); }
  .file-ref { color: var(--blue); font-family: monospace; font-size: 13px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

  @media (max-width: 768px) {
    .stats-bar { gap: 8px; padding: 12px 16px; }
    .stat-card { padding: 12px; min-width: 100px; }
    .stat-card .num { font-size: 22px; }
    .controls { padding: 0 16px 12px; }
    .search { width: 100%; }
    .main { padding: 0 16px 40px; }
    .header { padding: 16px; }
    .issue-header { padding: 14px 16px; }
    .issue-details { padding: 0 16px 16px 50px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Lennox Fields - Site Audit</h1>
  <p>Exhaustive audit completed March 22, 2026 &mdash; 45 issues found across content, links, design, accessibility, and business readiness</p>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="controls">
  <input type="text" class="search" id="search" placeholder="Search issues..." />
  <button class="filter-btn" data-cat="all" onclick="filterCategory('all')">All Categories</button>
  <button class="filter-btn" data-cat="broken-link" onclick="filterCategory('broken-link')">Broken Links</button>
  <button class="filter-btn" data-cat="content" onclick="filterCategory('content')">Content</button>
  <button class="filter-btn" data-cat="design" onclick="filterCategory('design')">Design/UX</button>
  <button class="filter-btn" data-cat="accessibility" onclick="filterCategory('accessibility')">Accessibility</button>
  <button class="filter-btn" data-cat="business" onclick="filterCategory('business')">Business</button>
  <button class="filter-btn" data-cat="seo" onclick="filterCategory('seo')">SEO</button>
  <button class="filter-btn" data-cat="performance" onclick="filterCategory('performance')">Performance</button>
  <div class="progress-bar">
    <span id="progressText">0/45 resolved</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="main">
  <div class="issue-list" id="issueList"></div>
</div>

// State
let resolvedIds = JSON.parse(localStorage.getItem('lf-audit-resolved') || '[]');
let activeFilter = 'all';
let activePriority = null;
let searchQuery = '';

// Render stats
function renderStats() {
  const counts = { p0: 0, p1: 0, p2: 0, p3: 0, total: 0 };
  issues.forEach(i => { counts[i.priority]++; counts.total++; });
  const resolved = resolvedIds.length;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card all ${activePriority === null ? 'active' : ''}" onclick="filterPriority(null)">
      <div class="num">${counts.total}</div><div class="label">Total Issues</div>
    </div>
    <div class="stat-card p0 ${activePriority === 'p0' ? 'active' : ''}" onclick="filterPriority('p0')">
      <div class="num">${counts.p0}</div><div class="label">P0 Critical</div>
    </div>
    <div class="stat-card p1 ${activePriority === 'p1' ? 'active' : ''}" onclick="filterPriority('p1')">
      <div class="num">${counts.p1}</div><div class="label">P1 High</div>
    </div>
    <div class="stat-card p2 ${activePriority === 'p2' ? 'active' : ''}" onclick="filterPriority('p2')">
      <div class="num">${counts.p2}</div><div class="label">P2 Medium</div>
    </div>
    <div class="stat-card p3 ${activePriority === 'p3' ? 'active' : ''}" onclick="filterPriority('p3')">
      <div class="num">${counts.p3}</div><div class="label">P3 Low</div>
    </div>
    <div class="stat-card fixed">
      <div class="num">${resolved}</div><div class="label">Resolved</div>
    </div>
  `;

  const pct = counts.total ? Math.round((resolved / counts.total) * 100) : 0;
  document.getElementById('progressText').textContent = `${resolved}/${counts.total} resolved`;
  document.getElementById('progressFill').style.width = pct + '%';
}

// Render issues
function renderIssues() {
  const list = document.getElementById('issueList');
  const filtered = issues.filter(i => {
    if (activePriority && i.priority !== activePriority) return false;
    if (activeFilter !== 'all' && i.category !== activeFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return i.title.toLowerCase().includes(q) || i.description.toLowerCase().includes(q) ||
             i.files.some(f => f.toLowerCase().includes(q)) || i.category.toLowerCase().includes(q);
    }
    return true;
  });

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#x1F50D;</div><p>No issues match your filters</p></div>';
    return;
  }

  list.innerHTML = filtered.map(i => {
    const isResolved = resolvedIds.includes(i.id);
    const priorityLabels = { p0: 'P0 Critical', p1: 'P1 High', p2: 'P2 Medium', p3: 'P3 Low' };
    const categoryLabels = {
      'broken-link': 'Broken Link', content: 'Content', design: 'Design/UX',
      accessibility: 'Accessibility', business: 'Business', seo: 'SEO', performance: 'Performance'
    };
    return `
      <div class="issue ${isResolved ? 'resolved' : ''}" id="issue-${i.id}">
        <div class="issue-header" onclick="toggleIssue(${i.id})">
          <div class="issue-checkbox ${isResolved ? 'checked' : ''}" onclick="event.stopPropagation(); toggleResolved(${i.id})"></div>
          <div class="issue-body">
            <div class="issue-title">${i.title}</div>
            <div class="issue-meta">
              <span class="tag ${i.priority}">${priorityLabels[i.priority]}</span>
              <span class="tag category">${categoryLabels[i.category]}</span>
            </div>
          </div>
          <span class="chevron">&#x276F;</span>
        </div>
        <div class="issue-details">
          <div class="detail-section">
            <h4>Description</h4>
            <p>${i.description}</p>
          </div>
          <div class="detail-section">
            <h4>Impact</h4>
            <p>${i.impact}</p>
          </div>
          <div class="detail-section">
            <h4>Files</h4>
            <ul>${i.files.map(f => `<li><span class="file-ref">${f}</span></li>`).join('')}</ul>
          </div>
          <div class="detail-section">
            <h4>Recommended Fix</h4>
            <p>${i.fix}</p>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleIssue(id) {
  const el = document.getElementById('issue-' + id);
  el.classList.toggle('open');
}

function toggleResolved(id) {
  if (resolvedIds.includes(id)) {
    resolvedIds = resolvedIds.filter(x => x !== id);
  } else {
    resolvedIds.push(id);
  }
  localStorage.setItem('lf-audit-resolved', JSON.stringify(resolvedIds));
  renderStats();
  renderIssues();
}

function filterPriority(p) {
  activePriority = p;
  renderStats();
  renderIssues();
}

function filterCategory(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  renderIssues();
}

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderIssues();
});

// Init
renderStats();
renderIssues();
</script>
